<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% if title %}{{ title }} — ShelfLife{% else %}ShelfLife{% endif %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>

<!-- ===== Navigation bar ===== -->
<nav>
    <div class="container">
        <span class="brand">🥫 ShelfLife</span>
        <a href="{{ url_for('dashboard') }}"  {% if request.endpoint == 'dashboard'  %}class="active"{% endif %}>Dashboard</a>
        <a href="{{ url_for('add_item') }}"   {% if request.endpoint == 'add_item'   %}class="active"{% endif %}>Add Item</a>
        <a href="{{ url_for('expiring') }}"   {% if request.endpoint == 'expiring'   %}class="active"{% endif %}>Expiring</a>
        <a href="{{ url_for('inventory') }}"  {% if request.endpoint == 'inventory'  %}class="active"{% endif %}>Inventory</a>
    </div>
</nav>

<!-- ===== Main content ===== -->
<main>
    <div class="container">

        <!-- Flash messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-messages">
                    {% for category, message in messages %}
                        <div class="flash {{ category }}">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <!-- Page-specific content injected here -->
        {% block content %}{% endblock %}

    </div>
</main>

</body>
</html>
