version: '3.8'

services:
  shelflife:
    build: .
    container_name: shelflife-app
    ports:
      - "5000:5000"
    environment:
      - DB_PATH=/data/shelflife.db
    volumes:
      - shelflife-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  shelflife-data:
    name: shelflife-data
